name: Build Noctora OS image

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily rebuild picks up Fedora/Plasma updates
  workflow_dispatch:

env:
  IMAGE_NAME: noctora-os
  FEDORA_VERSION: "45"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v4

      - name: Work out image name and tags
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: |
          podman build \
            --build-arg FEDORA_VERSION="${FEDORA_VERSION}" \
            --label org.opencontainers.image.title="Noctora OS" \
            --label org.opencontainers.image.description="The living-room OS, powered by Plasma Bigscreen" \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            -t "${{ steps.meta.outputs.image }}:latest" \
            -t "${{ steps.meta.outputs.image }}:${FEDORA_VERSION}" \
            -t "${{ steps.meta.outputs.image }}:${FEDORA_VERSION}-${{ steps.meta.outputs.date }}" \
            .

      - name: Push to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin
          for tag in latest "${FEDORA_VERSION}" "${FEDORA_VERSION}-${{ steps.meta.outputs.date }}"; do
            podman push "${{ steps.meta.outputs.image }}:${tag}"
          done
