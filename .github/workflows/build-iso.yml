name: Build Noctora OS installer ISO

# Runs automatically after every successful image build on main,
# and can also be started by hand.
on:
  workflow_run:
    workflows: ["Build Noctora OS image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to turn into an ISO"
        default: "latest"
        required: true

env:
  IMAGE_NAME: noctora-os

concurrency:
  group: build-iso
  cancel-in-progress: true

permissions:
  contents: read
  packages: read
  id-token: write

jobs:
  iso:
    # Skip if the image build that triggered us failed.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}:${{ inputs.tag || 'latest' }}" >> "$GITHUB_ENV"
          echo "USER_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "USER_GID=$(id -g)" >> "$GITHUB_ENV"

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - uses: actions/checkout@v4

      - name: Build ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d
        with:
          builder-image: quay.io/centos-bootc/bootc-image-builder:latest
          config-file: ./iso/config.toml
          image: ${{ env.IMAGE }}
          chown: ${{ env.USER_UID }}:${{ env.USER_GID }}
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: noctora-os-iso
          path: ${{ steps.build.outputs.output-directory }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
